name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CI / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repo's devEngines requires npm 11.x; Node 22 bundles 10.x.
      # NOTE: setup-node `cache: npm` is omitted because it runs
      # `npm config get cache` before we can upgrade, tripping
      # EBADDEVENGINES on the local package.json.
      - run: npm install -g npm@11.6.2
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm run build
        continue-on-error: true
        # TODO: remove once pre-existing build/type errors are fixed

  lint:
    name: CI / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
        # TODO: remove once the 152 lint warnings are resolved

  check-types:
    name: CI / check-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm run check-types
        continue-on-error: true
        # TODO: remove once pre-existing type errors are fixed

  test:
    name: CI / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm --workspace web run test
        continue-on-error: true
        # TODO: remove once the failing vitest assertion is fixed
