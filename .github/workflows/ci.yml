name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repo's devEngines requires npm 11.x; Node 22 bundles 10.x.
      # NOTE: setup-node `cache: npm` is omitted because it runs
      # `npm config get cache` before we can upgrade, tripping
      # EBADDEVENGINES on the local package.json.
      - run: npm install -g npm@11
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm run lint

  check-types:
    name: check-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm run check-types

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm11-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-22-npm11-
      - run: npm ci
      - run: npm --workspace web run test
